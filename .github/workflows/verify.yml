name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run golden set (offline, stdlib only)
        run: python tests/run_golden.py
      - name: Tamper test — fidelity must be provable
        run: python demo/tamper_test.py

      - name: Self-audit with the LGD engine (static 96 + executed 100)
        run: |
          # lgd-engine-executed
          git clone --depth 1 https://github.com/zhaoxinghua09-cell/lgd-skill-review.git "$RUNNER_TEMP/lgd-engine"
          python "$RUNNER_TEMP/lgd-engine/scripts/review.py" . --json --run
